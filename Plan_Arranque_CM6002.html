<style>
/* Layout: tablero de obra — banda de cabecera COMIN, pestañas por vista, resumen primero; el detalle se despliega por frente. */
:root{

  --accent:#0B70B8; --accent-2:#2588C1; --accent-soft:#DCEBF7;
  --ok:#1E8A55; --ok-soft:#DDF2E6; --warn:#B86E00; --warn-soft:#FBEBD0; --crit:#C8102E; --crit-soft:#FADDE2;
  --rt:#6A4FB0; --rt-soft:#ECE6F8; --comp:#2E8C8C; --comp-soft:#DDF1F1;
  --receso:rgba(122,123,125,.16);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#15212D; --surface-2:#1B2A38; --line:#2A3B4C;
  --fg:#E6EDF4; --fg-2:#A9B7C5; --fg-3:#7D8C9B;
  --accent:#4FA3E0; --accent-2:#6CB6E8; --accent-soft:#16344D;
  --ok:#4CC488; --ok-soft:#173A2A; --warn:#E9A23B; --warn-soft:#3D2E14; --crit:#FF5C73; --crit-soft:#47202A;
  --rt:#A68CF0; --rt-soft:#2C2447; --comp:#5CC6C6; --comp-soft:#173B3D;
  --receso:rgba(169,183,197,.12); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#15212D; --surface-2:#1B2A38; --line:#2A3B4C;
  --fg:#E6EDF4; --fg-2:#A9B7C5; --fg-3:#7D8C9B;
  --accent:#4FA3E0; --accent-2:#6CB6E8; --accent-soft:#16344D;
  --ok:#4CC488; --ok-soft:#173A2A; --warn:#E9A23B; --warn-soft:#3D2E14; --crit:#FF5C73; --crit-soft:#47202A;
  --rt:#A68CF0; --rt-soft:#2C2447; --comp:#5CC6C6; --comp-soft:#173B3D;
  --receso:rgba(169,183,197,.12); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--azul)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .small{font-size:13px}

/* Cabecera */
.band{background:var(--azul);color:#fff}
.band .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.band-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center}
.logo{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.06em;line-height:1;padding:6px 10px;border:2px solid #fff;border-radius:3px}
.logo span{color:#fff;background:var(--rojo);padding:0 3px;margin-left:2px}
.band h1{font-size:28px;font-weight:600;letter-spacing:.01em}
.band .sub{font-size:13px;color:rgba(255,255,255,.82)}
.band-actions{display:flex;gap:8px;align-items:center}
.btn{font:inherit;font-size:13px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px;cursor:pointer}
.btn:focus-visible,.tab:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.band .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.03em;color:rgba(255,255,255,.78);background:transparent;border:0;padding:8px 14px 10px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg)}

main{padding-block:20px 40px}
.view{display:flex;flex-direction:column;gap:20px}
.view.is-hidden{display:none}
.section-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-title h2{font-size:24px;font-weight:600}
.eyebrow{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* Resumen */
.ficha{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ficha div{background:var(--surface);padding:10px 14px;min-width:0}
.ficha dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.ficha dd{margin:2px 0 0;font-weight:500}
.cuenta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cuenta .panel{display:flex;flex-direction:column;gap:2px}
.cuenta .n{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cuenta .lbl{font-weight:600}
.cuenta .panel.crit{border-left:4px solid var(--crit)} .cuenta .panel.warn{border-left:4px solid var(--warn)} .cuenta .panel.acc{border-left:4px solid var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.list li:last-child{border-bottom:0}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.bar-track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:flex}
.bar-track span{display:block;height:100%}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.r-COMIN{background:var(--accent-soft);color:var(--accent)} .r-RT{background:var(--rt-soft);color:var(--rt)} .r-COMP{background:var(--comp-soft);color:var(--comp)}
.e-Vencido{background:var(--crit-soft);color:var(--crit)} .e-Próximo{background:var(--warn-soft);color:var(--warn)} .e-Pendiente{background:var(--surface-2);color:var(--fg-2)} .e-Hecho{background:var(--ok-soft);color:var(--ok)} .e-En\ curso{background:var(--accent-soft);color:var(--accent)}
.h-chip{background:transparent;border:1px solid var(--line);color:var(--fg-2)}
.prop{font-size:11px;color:var(--fg-3);font-style:italic}

/* Plan */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--fg-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.filters select,.filters input{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-width:0}
.filters input{width:220px;max-width:100%}
details.frente{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.frente+details.frente{margin-top:8px}
details.frente>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
details.frente>summary::-webkit-details-marker{display:none}
.fid{font-family:var(--f-mono);font-size:13px;color:var(--fg-3)}
.fname{font-family:var(--f-display);font-size:19px;font-weight:600}
.fmeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
details.frente[open]>summary{border-bottom:1px solid var(--line)}
.items{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr:last-child td{border-bottom:0}
.items table{min-width:860px}
.it-name{font-weight:600}
.tareas{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--fg-2)}
.tareas li{margin:2px 0}
.tareas .chip{font-size:11px;padding:0 6px;margin-left:4px}
.date{font-family:var(--f-mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--fg-3);max-width:220px}

/* Línea de tiempo */
.tl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tl{min-width:1100px;position:relative}
.tl-row{display:grid;grid-template-columns:230px minmax(0,1fr);border-bottom:1px solid var(--line);min-height:30px}
.tl-row:last-child{border-bottom:0}
.tl-lab{padding:6px 10px;font-size:13px;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;min-width:0}
.tl-lab.f{font-family:var(--f-display);font-size:16px;font-weight:600;cursor:pointer}
.tl-lab.i{padding-left:22px;color:var(--fg-2)}
.tl-track{position:relative}
.tl-head .tl-track{height:44px}
.wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--fg-3);padding:2px 3px;font-family:var(--f-mono)}
.mes{position:absolute;top:0;font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--fg-2);padding:2px 4px;letter-spacing:.04em}
.tl-head .wk{top:22px}
.tl-bar{position:absolute;top:8px;height:14px;border-radius:3px}
.tl-bar.f{top:9px;height:12px;background:var(--fg-3);opacity:.55}
.tl-bar.r-COMIN{background:var(--accent)} .tl-bar.r-RT{background:var(--rt)} .tl-bar.r-COMP{background:var(--comp)}
.tl-bar.vencido{outline:2px solid var(--crit);outline-offset:1px}
.tl-dot{position:absolute;top:7px;width:12px;height:12px;transform:translateX(-6px) rotate(45deg);border:2px solid var(--surface)}
.tl-over{position:absolute;top:0;bottom:0;pointer-events:none}
.tl-receso{background:var(--receso)}
.tl-hoy{border-left:2px solid var(--rojo)}
.tl-meta{border-left:2px dashed var(--fg-2)}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--fg-2);align-items:center}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* Línea crítica */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpis .panel{padding:12px 14px}
.kpis .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpis .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-2);font-family:var(--f-mono);font-size:11px}
.chart .axis{stroke:var(--line)}
.ok-txt{color:var(--ok)} .crit-txt{color:var(--crit)} .warn-txt{color:var(--warn)}
.iwp-table{overflow-x:auto;max-height:520px;overflow-y:auto}
.iwp-table table{min-width:820px}
.iwp-table thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtab{font:inherit;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.02em;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);cursor:pointer}
.subtab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.subtab:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.subpanel{display:flex;flex-direction:column;gap:16px}
.subpanel.is-hidden{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--fg-2);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.num td.n,.num th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.dif{background:var(--crit-soft)} .dif td:first-child{border-left:3px solid var(--crit)}
.note{font-size:13px;color:var(--fg-2);border-left:3px solid var(--warn);padding:6px 10px;background:var(--warn-soft);border-radius:0 var(--r) var(--r) 0}


/* Supuestos y simulación */
.sim-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.sim-bar.activa{border-color:var(--warn);background:var(--warn-soft)}
.sim-bar strong{font-family:var(--f-display);font-size:18px;font-weight:600}
.btn.primario{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.bloques{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:960px){.bloques{grid-template-columns:minmax(0,1fr)}}
.prm{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prm:last-child{border-bottom:0}
.prm .lbl{font-weight:500;min-width:0}
.prm .lbl small{display:block;font-size:12px;color:var(--fg-3);font-weight:400}
.prm input{font:inherit;font-size:14px;width:100%;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;font-variant-numeric:tabular-nums}
.prm input.cambiado{border-color:var(--warn);background:var(--warn-soft)}
.prm .calc{font-family:var(--f-mono);font-size:14px;text-align:right;padding-right:4px}
.o-Contrato{background:var(--crit-soft);color:var(--crit)} .o-Oferta{background:var(--accent-soft);color:var(--accent)} .o-Supuesto{background:var(--warn-soft);color:var(--warn)} .o-Calculado{background:var(--surface-2);color:var(--fg-2)}
.rampa-tab td{padding:5px 6px} .rampa-tab input{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px;width:100%}
.rampa-tab input.cambiado{border-color:var(--warn);background:var(--warn-soft)}
.btn.mini{padding:2px 8px;font-size:12px}
@media (max-width:560px){.prm{grid-template-columns:minmax(0,1fr) 120px}.prm .chip{grid-column:1/-1;justify-self:start}}
@media print{.prm input,.rampa-tab input{border:0;background:transparent;padding:0}}
footer{border-top:1px solid var(--line);padding-block:14px;font-size:12px;color:var(--fg-3)}

@media (max-width:860px){.ficha{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .ficha{grid-template-columns:minmax(0,1fr)}
  .band h1{font-size:22px} .list li{grid-template-columns:84px minmax(0,1fr)} .list li .chip{grid-column:2}
  details.frente>summary{grid-template-columns:44px minmax(0,1fr)} .fmeta{grid-column:1/-1;justify-content:flex-start}
  .bar-row{grid-template-columns:90px minmax(0,1fr) 34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Impresión: todo visible, sin controles, resumen primero */
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;color:#000;font-size:11pt}
  body::before{display:none}
  .no-print{display:none!important}
  .view.is-hidden{display:flex!important}
  .view{break-before:page} .view:first-child{break-before:auto}
  .band{background:#fff;color:#000;border-bottom:3px solid var(--azul)} .band .sub{color:#333}
  .logo{border-color:var(--azul);color:var(--azul)}
  .panel,details.frente,.tl-scroll{border-color:#bbb;break-inside:avoid}
  .tl-scroll,.items,.iwp-table{overflow:visible;max-height:none}
  .subpanel.is-hidden{display:flex!important} .subpanel{break-before:page}
  .tl{min-width:0}
  details.frente>summary{border-bottom:1px solid #bbb}
}
</style>

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("plan-datos").textContent);
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400000;
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
const iso = d => d.toISOString().slice(0,10);
const add = (d, n) => new Date(d.getTime() + n*DAY);
const diff = (a, b) => Math.round((b - a)/DAY);
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmt = d => { if (typeof d === "string") d = toD(d); return String(d.getUTCDate()).padStart(2,"0") + "-" + MES[d.getUTCMonth()] + "-" + String(d.getUTCFullYear()).slice(2); };
const fmtN = (n, dec=0) => n.toLocaleString("es-AR", {minimumFractionDigits:dec, maximumFractionDigits:dec});
const RESP = D.responsables;
const respChip = r => `<span class="chip r-${esc(r)}">${esc(RESP[r] || r)}</span>`;

const corte = toD(D.control.fecha_corte);
const acuerdo = toD(D.fechas.acuerdo);
const [H1, H2] = D.fechas.horizontes;
const parseParadas = arr => arr.filter(p => p.desde && p.hasta).map(p => ({desde: toD(p.desde), hasta: toD(p.hasta), motivo: p.motivo}));
let paradas = parseParadas(D.calendario.paradas);
const enParada = d => paradas.some(p => d >= p.desde && d <= p.hasta);

function horizonte(fin){ const n = diff(acuerdo, toD(fin)); return n <= H1 ? `0–${H1}` : n <= H2 ? `${H1+1}–${H2}` : `> ${H2}`; }
function estado(it){
  if (it.estado === "Hecho" || it.estado === "En curso") return it.estado;
  const f = toD(it.fin);
  if (f < corte) return "Vencido";
  if (diff(corte, f) <= 14) return "Próximo";
  return "Pendiente";
}
const ITEMS = [];
D.frentes.forEach(f => f.items.forEach(it => { it._frente = f; it._h = horizonte(it.fin); it._e = estado(it); ITEMS.push(it); }));

/* ---------- Línea crítica: rampa e IWP calculados ---------- */
function calcularLinea(L, cal){
  cal = cal || D.calendario;
  const hhm = L.hh_total / L.metros;
  const hhJornada = L.personas_cuadrilla * cal.horas_jornada;
  const mJornada = hhJornada / hhm;
  const rampa = L.rampa.map(r => ({desde: toD(r.desde), n: r.cuadrillas})).sort((a,b) => a.desde - b.desde);
  const crews = d => { if (enParada(d)) return 0; let n = 0; rampa.forEach(r => { if (d >= r.desde) n = r.n; }); return n; };
  const rest = {}; L.lineas.forEach(l => rest[l.id] = l.metros);
  const prog = {}; L.lineas.forEach(l => prog[l.id] = 0);
  const cont = {}; L.lineas.forEach(l => cont[l.id] = 0);
  const iwps = []; const slots = []; const curva = []; const tramos = [];
  const T = L.tramo_m;
  function cerrarTramo(w, d, final){
    while (w.hecho - w.nTr * T >= T - 1e-6 || (final && w.hecho - w.nTr * T > 1e-6)){
      const a = w.pk[0] + w.nTr * T, b = Math.min(a + T, w.pk[1]);
      w.nTr += 1;
      tramos.push({id: `${w.linea}-${String(Math.round(a/T)+1).padStart(2,"0")}`, iwp: w.id, linea: w.linea, pk: [a, b], m: b - a, fin: d});
      if (b >= w.pk[1] - 1e-6) break;
    }
  }
  const pilotoHasta = toD(L.iwp.piloto_hasta);
  let d = toD(L.inicio), acum = 0, guard = 0;
  function nuevoIWP(dia, slot){
    const lin = L.lineas.slice().sort((a,b) => rest[b.id] - rest[a.id])[0];
    if (!lin || rest[lin.id] <= 0.001) return null;
    const tramos = dia <= pilotoHasta ? L.iwp.piloto_tramos : L.iwp.produccion_tramos;
    const m = Math.min(tramos * L.tramo_m, rest[lin.id]);
    const desde = prog[lin.id]; rest[lin.id] -= m; prog[lin.id] += m; cont[lin.id] += 1;
    const w = {id: `${L.iwp_prefijo}-${lin.id}-${String(cont[lin.id]).padStart(3,"0")}`, cwp: `${L.cwp_prefijo}-${lin.id}`, linea: lin.id,
      pk: [desde, desde + m], m, hh: m*hhm, jornadas: m/mJornada, falta: m/mJornada, inicio: null, fin: null, cuadrilla: slot+1, piloto: dia <= pilotoHasta, hecho: 0, nTr: 0};
    iwps.push(w); return w;
  }
  while (guard++ < 800){
    const n = crews(d);
    let mDia = 0;
    for (let k = 0; k < n; k++){
      let cap = 1;
      while (cap > 1e-9){
        if (!slots[k]) { slots[k] = nuevoIWP(d, k); if (!slots[k]) break; }
        const w = slots[k];
        if (!w.inicio) w.inicio = d;
        const usa = Math.min(cap, w.falta);
        w.falta -= usa; cap -= usa; mDia += usa * mJornada; w.hecho += usa * mJornada;
        if (w.falta <= 1e-9){ w.hecho = w.m; w.fin = d; cerrarTramo(w, d, true); slots[k] = null; } else cerrarTramo(w, d, false);
      }
    }
    acum += mDia;
    curva.push({d, n, m: mDia, acum: Math.min(acum, L.metros)});
    const quedan = Object.values(rest).some(v => v > 0.001) || slots.some(s => s);
    if (!quedan) break;
    d = add(d, 1);
  }
  const fin = iwps.reduce((mx, w) => w.fin && w.fin > mx ? w.fin : mx, toD(L.inicio));
  const lib = L.iwp.liberar_dias_antes;
  iwps.forEach(w => { w.liberar = w.inicio ? add(w.inicio, -lib) : null; });
  const completo = !Object.values(rest).some(v => v > 0.001) && !slots.some(s => s) && iwps.every(w => w.fin);
  const pico = curva.reduce((m, c) => Math.max(m, c.n), 0);
  const P = L.pruebas, area = Math.PI / 4 * Math.pow(P.di_mm / 1000, 2);
  tramos.forEach(t => { t.ph = add(t.fin, P.dias_a_prueba); t.agua = area * t.m; });
  iwps.forEach(w => { const ts = tramos.filter(t => t.iwp === w.id); w.tramos = ts.length;
    w.phFin = ts.reduce((mx, t) => !mx || t.ph > mx ? t.ph : mx, null); w.precom = w.phFin ? add(w.phFin, P.dias_a_precom) : null; });
  const finPruebas = iwps.reduce((mx, w) => w.precom && (!mx || w.precom > mx) ? w.precom : mx, null);
  const jornadasCuadrilla = curva.reduce((s, c) => s + c.n, 0);
  return {hhm, hhJornada, mJornada, iwps, curva, fin, jornadasCuadrilla, rampa, completo, pico, tramos, area, finPruebas,
    margen: diff(fin, toD(L.fin_produccion)), margenPruebas: finPruebas ? diff(finPruebas, toD(L.fin_objetivo)) : null,
    cuadrillaJornadasNecesarias: L.metros / mJornada};
}
const clone = o => JSON.parse(JSON.stringify(o));
const SIM = {L: clone(D.linea_critica), cal: clone(D.calendario)};
let LC = calcularLinea(SIM.L, SIM.cal);
const margenCls = m => m < 0 ? "crit" : m <= 7 ? "warn" : "ok";
const margenTxt = m => (m > 0 ? "+" : "") + m;

/* ---------- Cabecera y pie ---------- */
const O = D.obra;
$("#subtitulo").textContent = `${O.codigo} · ${O.contrato} ${O.nombre} · ${O.cliente} · corte ${fmt(D.control.fecha_corte)}`;
$("#pie").innerHTML = `Plan de Arranque ${esc(O.contrato)} · v${esc(D.control.version)} · corte ${fmt(D.control.fecha_corte)} · ${esc(D.control.autor)} · ${esc(D.control.nota)}`;

/* ---------- Vista Resumen ---------- */
function vResumen(){
  const venc = ITEMS.filter(i => i._e === "Vencido"), prox = ITEMS.filter(i => i._e === "Próximo");
  const hitosC = D.hitos.filter(h => toD(h.fecha) >= corte).slice(0, 7);
  const dHasta = f => diff(corte, toD(f));
  const L = SIM.L;
  const cuentas = [
    {n: dHasta("2026-10-29"), lbl: "días al vencimiento de cauciones y seguros", sub: "29-oct-26 · 57.1 y Schedule N", cls: "crit"},
    {n: dHasta(L.inicio), lbl: "días al arranque de la línea HDPE", sub: `${fmt(L.inicio)} · piloto con 2 cuadrillas`, cls: "warn"},
    {n: dHasta(L.fin_objetivo), lbl: "días al fin de la línea HDPE", sub: `${fmt(L.fin_objetivo)} · Schedule G`, cls: "acc"},
    {n: LC ? margenTxt(LC.margen) : "—", lbl: "días de margen de la termofusión", sub: LC ? `fin calculado ${fmt(LC.fin)} contra ${fmt(L.fin_produccion)}${LC.margen<=7?" · sin colchón":""}` : "", cls: LC ? (margenCls(LC.margen)==="ok"?"acc":margenCls(LC.margen)) : "acc"}
  ];
  const porResp = {}; ITEMS.forEach(i => porResp[i.resp] = (porResp[i.resp]||0) + 1);
  const porH = {}; ITEMS.forEach(i => porH[i._h] = (porH[i._h]||0) + 1);
  const tot = ITEMS.length;
  const bar = (obj, cls) => Object.keys(obj).map(k => `<div class="bar-row"><span>${cls ? respChip(k) : esc(k)+" días"}</span><div class="bar-track"><span style="width:${obj[k]/tot*100}%;background:var(${cls ? (k==="RT"?"--rt":k==="COMP"?"--comp":"--accent") : "--accent-2"})"></span></div><span class="mono">${obj[k]}</span></div>`).join("");
  const alertas = venc.concat(prox).sort((a,b) => toD(a.fin) - toD(b.fin));
  $("#v-resumen").innerHTML = `
    <dl class="ficha">
      <div><dt>Obra</dt><dd>${esc(O.codigo)} · ${esc(O.contrato)}</dd></div>
      <div><dt>Cliente / ingeniería</dt><dd>${esc(O.cliente)} · ${esc(O.ingenieria)}</dd></div>
      <div><dt>Sitio</dt><dd>${esc(O.sitio)}</dd></div>
      <div><dt>Régimen</dt><dd>${esc(D.calendario.regimen)}</dd></div>
      <div><dt>Parada</dt><dd>${paradas.map(p => `${fmt(p.desde)} a ${fmt(p.hasta)}`).join(", ")}</dd></div>
      <div><dt>Objetivo del plan</dt><dd>${esc(L.nombre)} terminada el ${fmt(L.fin_objetivo)}</dd></div>
    </dl>
    <div class="cuenta">${cuentas.map(c => `<div class="panel ${c.cls}"><span class="n">${esc(c.n)}</span><span class="lbl">${esc(c.lbl)}</span><span class="small muted">${esc(c.sub)}</span></div>`).join("")}</div>
    <div class="grid2">
      <div class="panel">
        <div class="section-title"><h2>Atención</h2><span class="muted small">vencidos y próximos 14 días al ${fmt(corte)}</span></div>
        <ul class="list">${alertas.map(i => `<li><span class="date">${fmt(i.fin)}</span><span><strong>${esc(i.id)}</strong> ${esc(i.nombre)} <span class="muted small">· ${esc(i._frente.nombre)}</span></span><span class="chip e-${esc(i._e)}">${esc(i._e)}</span></li>`).join("") || `<li><span></span><span class="muted">Sin vencimientos en los próximos 14 días.</span></li>`}</ul>
      </div>
      <div class="panel">
        <div class="section-title"><h2>Próximos hitos</h2></div>
        <ul class="list">${hitosC.map(h => `<li><span class="date">${fmt(h.fecha)}</span><span>${esc(h.nombre)} <span class="muted small">· ${esc(h.fuente)}</span></span><span class="chip ${h.tipo==="contractual"?"e-Vencido":h.tipo==="objetivo"?"r-COMIN":"h-chip"}">${esc(h.tipo)}</span></li>`).join("")}</ul>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="section-title"><h2>Quién tiene que hacer qué</h2><span class="muted small">${tot} entregables</span></div><div class="bars">${bar(porResp, true)}</div></div>
      <div class="panel"><div class="section-title"><h2>Por horizonte</h2><span class="muted small">desde la fecha de acuerdo ${fmt(acuerdo)}</span></div><div class="bars">${bar(porH, false)}</div></div>
    </div>`;
}

/* ---------- Vista Plan ---------- */
const F = {h: "", r: "", e: "", q: ""};
function vPlan(){
  const opts = (arr, sel) => arr.map(([v,t]) => `<option value="${esc(v)}"${v===sel?" selected":""}>${esc(t)}</option>`).join("");
  const hs = [...new Set(ITEMS.map(i => i._h))];
  $("#v-plan").innerHTML = `
    <div class="filters no-print">
      <label for="f-h">Horizonte<select id="f-h">${opts([["","Todos"], ...hs.map(h => [h, h+" días"])], F.h)}</select></label>
      <label for="f-r">Responsable<select id="f-r">${opts([["","Todos"], ...Object.keys(RESP).map(k => [k, RESP[k]])], F.r)}</select></label>
      <label for="f-e">Estado<select id="f-e">${opts([["","Todos"],["Vencido","Vencido"],["Próximo","Próximo"],["Pendiente","Pendiente"],["En curso","En curso"],["Hecho","Hecho"]], F.e)}</select></label>
      <label for="f-q">Buscar<input id="f-q" type="search" value="${esc(F.q)}" placeholder="termofusión, Schedule N…"></label>
      <button class="btn" type="button" id="f-abrir">Abrir todo</button>
      <button class="btn" type="button" id="f-cerrar">Cerrar todo</button>
    </div>
    <div id="plan-lista"></div>`;
  ["h","r","e","q"].forEach(k => $("#f-"+k).addEventListener("input", ev => { F[k] = ev.target.value; listaPlan(); }));
  $("#f-abrir").onclick = () => document.querySelectorAll("#plan-lista details").forEach(d => d.open = true);
  $("#f-cerrar").onclick = () => document.querySelectorAll("#plan-lista details").forEach(d => d.open = false);
  listaPlan();
}
function pasaFiltro(it){
  if (F.h && it._h !== F.h) return false;
  if (F.e && it._e !== F.e) return false;
  if (F.r && it.resp !== F.r && !(it.tareas||[]).some(t => t.resp === F.r)) return false;
  if (F.q){ const q = F.q.toLowerCase(); const txt = [it.id, it.nombre, it.fuente, ...(it.tareas||[]).map(t => t.nombre)].join(" ").toLowerCase(); if (!txt.includes(q)) return false; }
  return true;
}
function listaPlan(){
  const filtrando = F.h || F.r || F.e || F.q;
  const html = D.frentes.map(f => {
    const its = f.items.filter(pasaFiltro);
    if (!its.length) return "";
    const ini = f.items.reduce((m,i) => i.inicio < m ? i.inicio : m, "9999"), fin = f.items.reduce((m,i) => i.fin > m ? i.fin : m, "0000");
    const nv = f.items.filter(i => i._e === "Vencido").length, np = f.items.filter(i => i._e === "Próximo").length;
    return `<details class="frente"${filtrando ? " open" : ""}>

/* Agrupa la producción diaria por día, semana (lunes) o quincena (1–15 / 16–fin) */
function produccion(L, R, modo){
  const clave = modo === "dia" ? (d => d) : modo === "semana" ? lunes : quincena;
  const rows = new Map();
  const fila = d => { const k = iso(clave(d)); if (!rows.has(k)) rows.set(k, {desde: clave(d), hasta: d, nMax: 0, metros: 0, tf: 0, bridas: 0, ef: 0, ph: 0, agua: 0, jc: 0}); const r = rows.get(k); if (d > r.hasta) r.hasta = d; return r; };
  R.curva.forEach(c => { const r = fila(c.d); r.metros += c.m; r.nMax = Math.max(r.nMax, c.n); r.jc += c.n; });
  R.tramos.forEach(t => { const r = fila(t.fin); r.bridas += 1; r.ef += L.uniones.ef_por_brida; });
  R.tramos.forEach(t => { const r = fila(t.ph); r.ph += 1; r.agua += t.agua; });
  const out = [...rows.values()].sort((a, b) => a.desde - b.desde);
  out.forEach(r => { r.tf = r.metros / L.cano_m; if (modo !== "dia") r.hasta = modo === "semana" ? add(r.desde, 6) : (r.desde.getUTCDate() === 1 ? add(r.desde, 14) : add(new Date(Date.UTC(r.desde.getUTCFullYear(), r.desde.getUTCMonth()+1, 1)), -1)); });
  return out;
}

    let nota = q.nota || "";
    if (q.id === "PH"){ const pw = Math.max(0, ...produccion(L, R, "semana").map(r => r.ph)); const porCal = Math.ceil(pw / 7 * L.pruebas.dias_a_prueba - 1e-9);

}

  document.querySelectorAll("#sim-rampa input").forEach(el => el.addEventListener("change", () => {
    const r = SIM.L.rampa[+el.dataset.r]; if (!el.value) return;
    r[el.dataset.k] = el.dataset.k === "cuadrillas" ? Math.max(0, Math.round(+el.value)) : el.value;
    SIM.L.rampa.sort((a, c) => a.desde < c.desde ? -1 : 1); recalcular(true);
  }));
  document.querySelectorAll("#sim-rampa [data-del]").forEach(el => el.onclick = () => { SIM.L.rampa.splice(+el.dataset.del, 1); recalcular(true); });
}
function vSupuestos(){
  const L = SIM.L, ct = L.cuadrilla_tipo, cr = L.cruces_rendimiento;
  const bloque = b => PRM.map((p, i) => p.b === b ? prmRow(p, i) : "").join("");
  $("#v-supuestos").innerHTML = `
    <div class="section-title"><h2>Supuestos y simulación</h2><span class="muted small">todo lo que está detrás del cálculo de la línea HDPE 800, con su origen</span></div>
    <div id="sim-bar" class="sim-bar"></div>
    <div class="kpis" id="sim-kpis"></div>
    <div class="leyenda">${oChip("Contrato")} lo fija el contrato ${oChip("Oferta")} sale de la oferta (APU, cómputo) ${oChip("Supuesto")} criterio de obra, se puede discutir ${oChip("Calculado")} resultado</div>
    <div class="bloques">
      <div class="panel"><div class="section-title"><h2>1. Calendario y fechas</h2></div>${bloque("cal")}</div>
      <div class="panel"><div class="section-title"><h2>2. Cuadrilla tipo y rendimiento</h2></div>${bloque("cua")}<div id="sim-calc"></div></div>
      <div class="panel"><div class="section-title"><h2>3. Etapas y rampa de cuadrillas</h2></div>
        <div class="items"><table style="min-width:0"><thead><tr><th>Etapa</th><th>Desde</th><th>Hasta</th><th>Días</th><th>Qué se hace</th></tr></thead><tbody id="sim-etapas"></tbody></table></div>
        <div class="section-title" style="margin-top:14px"><h3 style="font-size:18px">Rampa</h3>${oChip(ORI.rampa || "Supuesto")}<span class="muted small">cuadrillas activas desde cada fecha (0 = sin trabajo)</span></div>
        <div class="items"><table class="rampa-tab" style="min-width:0"><thead><tr><th>Desde</th><th>Cuadrillas</th><th class="no-print"></th></tr></thead><tbody id="sim-rampa"></tbody></table></div>
        <button class="btn no-print" type="button" id="sim-add" style="margin-top:8px">Agregar escalón</button>
        <div style="margin-top:14px">${bloque("iwp")}</div>
      </div>
      <div class="panel"><div class="section-title"><h2>4. Composición, medición y cruces</h2>${oChip("Oferta")}</div>
        <div class="items"><table style="min-width:0"><thead><tr><th>Oficio</th><th>Coef. APU</th></tr></thead><tbody>
          ${ct.roles.map(r => `<tr><td>${esc(r.rol)}</td><td class="mono">${fmtN(r.cant, 2)}</td></tr>`).join("")}
          <tr><td><strong>Total cuadrilla</strong></td><td class="mono"><strong>${fmtN(ct.roles.reduce((a, r) => a + r.cant, 0), 1)}</strong></td></tr></tbody></table></div>
        <div class="items" style="margin-top:12px"><table style="min-width:0"><thead><tr><th>Equipo</th><th>Coef. APU</th><th>Unidad</th></tr></thead><tbody>
          ${ct.equipos.map(e => `<tr><td>${esc(e.eq)}</td><td class="mono">${fmtN(e.cant, 2)}</td><td class="small">${esc(e.u)}</td></tr>`).join("")}</tbody></table></div>
        <p class="small muted">${esc(ct.fuente)}</p>
        <div class="items" style="margin-top:6px"><table style="min-width:0"><thead><tr><th>Medición y cobro</th><th>%</th><th>Fuente</th></tr></thead><tbody>
          ${L.medicion.map(m => `<tr><td>${esc(m.etapa)}</td><td class="mono">${m.pct} %</td><td class="src">${esc(m.fuente)}</td></tr>`).join("")}</tbody></table></div>
        <p class="small" style="margin-top:10px"><strong>Cruces de vía:</strong> ${cr.cantidad} cruces, ${fmtN(cr.hh_total)} HH, ${fmtN(cr.ea_dia, 2)} cruces por día (≈ ${fmtN(1/cr.ea_dia, 0)} días cada uno). <span class="muted">${esc(cr.fuente)}</span></p>
      </div>
    </div>`;
  document.querySelectorAll("#v-supuestos .prm input").forEach(el => el.addEventListener("change", () => {
    const p = PRM[+el.dataset.i]; if (el.value === "") { el.value = getP(p.path); return; }
    let v = p.tipo === "number" ? +el.value : el.value;
    if (p.tipo === "number"){ if (!isFinite(v) || v < (p.min ?? -Infinity)) { el.value = getP(p.path); return; } if (p.max != null && v > p.max) v = p.max; }
    setP(p.path, v); el.classList.toggle("cambiado", String(v) !== String(baseP(p.path))); recalcular(false);
  }));
  $("#sim-add").onclick = () => { const u = SIM.L.rampa[SIM.L.rampa.length - 1]; SIM.L.rampa.push({desde: iso(add(toD(u.desde), 14)), cuadrillas: u.cuadrillas + 1}); recalcular(true); };
  rampaRows(); simKpis();
}
function recalcular(redibujar){
  paradas = parseParadas(SIM.cal.paradas);
  LC = calcularLinea(SIM.L, SIM.cal);
  window.PLAN.LC = LC;
  vResumen(); vTiempo(); vLinea();
  if (redibujar) vSupuestos(); else simKpis();
}

/* ---------- Pestañas, hash y tema ---------- */
const VISTAS = ["resumen","plan","tiempo","linea","supuestos"];
function mostrar(v){
  if (!VISTAS.includes(v)) v = "resumen";
  VISTAS.forEach(k => { $("#v-"+k).classList.toggle("is-hidden", k !== v); $("#tab-"+k).setAttribute("aria-selected", String(k === v)); });
  try { history.replaceState(null, "", "#" + v); } catch(e){}
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => mostrar(t.dataset.view)));
const TEMAS = ["sistema","claro","oscuro"];
let tema = "sistema";
try { tema = localStorage.getItem("plan-tema") || "sistema"; } catch(e){}
function aplicarTema(){
  const r = document.documentElement;
  if (tema === "claro") r.setAttribute("data-theme","light"); else if (tema === "oscuro") r.setAttribute("data-theme","dark"); else r.removeAttribute("data-theme");
  $("#btn-tema").textContent = "Tema: " + tema;
}
$("#btn-tema").addEventListener("click", () => { tema = TEMAS[(TEMAS.indexOf(tema)+1) % 3]; try { localStorage.setItem("plan-tema", tema); } catch(e){} aplicarTema(); });

window.PLAN = {D, ITEMS, LC, SIM, recalcular};   /* para la prueba automática */
aplicarTema(); vResumen(); vPlan(); vTiempo(); vLinea(); vSupuestos();
mostrar((location.hash || "#resumen").slice(1));
})();
</script>

</body>
</html>
